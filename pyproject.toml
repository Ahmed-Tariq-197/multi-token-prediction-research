[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-research"
version = "0.1.0"
description = "AIE417: Base NTP, Standard MTP and (Phase 2) Improved MTP under a controlled setup"
readme = "README.md"
license = { file = "LICENSE" }
# Lower bounds follow the APIs used: torch.amp.GradScaler("cuda") needs torch>=2.3, the profiler's
# self_device_time_total needs >=2.4. Only torch 2.15 (CPU) has actually been exercised so far; CI covers the rest.
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "pyyaml>=6", "tokenizers>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=7", "transformers>=4.40", "ruff>=0.5"]
data = ["datasets>=2.18", "huggingface_hub"]

[project.scripts]
mtp-train = "mtp.train:main"
mtp-eval = "mtp.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs/validation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]          # `l`/`O` style names are fine in math-heavy code

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
