# Standard MTP, k = 2 (offsets +1,+2). Pilot / horizon ablation.
# total_tokens and lr are PLACEHOLDERS: the final values come from docs/CALIBRATION.md (budget.py + LR sweep).
name: mtp_k2
seed: 1337
model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  ffn_hidden: 1408
  max_seq_len: 1024
  num_pred_heads: 2
  eos_id: 0
loss: {lam: 1.0, mask_cross_document: true}
data:
  train_bin: data/fineweb_edu_8k/train.bin
  val_bin: data/fineweb_edu_8k/val.bin
  test_bin: data/fineweb_edu_8k/test.bin
  manifest: data/fineweb_edu_8k/manifest.json
  seq_len: 1024
  max_horizon: 8
train:
  total_tokens: 100000000      # PLACEHOLDER (derive with scripts/budget.py)
  global_batch_tokens: 65536
  micro_batch_size: 16
  lr: 0.001                    # PLACEHOLDER (short LR sweep per arm, see docs/CALIBRATION.md)
  warmup_steps: 200
  precision: fp16              # T4: fp16 autocast + GradScaler (no bf16)
  eval_every: 500
  eval_windows: 256
  ckpt_every: 500
  out_dir: runs/mtp_k2_s1337
